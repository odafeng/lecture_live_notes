  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="10-close"]');
      var $ = function (id) { return document.getElementById(id); };
      var all = function (cls) { return Array.prototype.slice.call(root.querySelectorAll('[class~="' + cls + '"]')); };

      // QR mosaic: hand-authored 8x8 pattern (deterministic)
      var QR = [
        "11100111",
        "10100101",
        "11100111",
        "00011000",
        "10110101",
        "01100010",
        "10101101",
        "11100110"
      ];
      var qr = $("10-close-qr");
      QR.join("").split("").forEach(function (bit) {
        var cell = document.createElement("div");
        cell.style.background = bit === "1" ? "#1F2BE0" : "rgba(31,43,224,0.10)";
        qr.appendChild(cell);
      });

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.1s): full diagram, fade-in only (same position as Frame 2's end)
      tl.fromTo($("10-close-map-outer"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 0);

      // Scene 2 (1.2–1.9s): "seven requirements" — tags pin outward from the diagram centre
      tl.fromTo($("10-close-kicker"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.2);

      var CX = 940, CY = 490, START_PROGRESS = 0.3, STAGGER = 0.05, EXPAND_DUR = 0.4;
      all("10-close-tag").forEach(function (el, i) {
        var dx = (CX - Number(el.dataset.fx)) * (1 - START_PROGRESS);
        var dy = (CY - Number(el.dataset.fy)) * (1 - START_PROGRESS);
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: dx, y: dy, scale: 0.6, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: "power3.out" },
          1.2 + i * STAGGER
        );
      });

      // Scene 3 (2.0s–end): diagram + tags dim to 35%, paper panel, closing line per phrase
      tl.fromTo($("10-close-map-inner"), { opacity: 1 }, { opacity: 0.35, duration: 0.6, ease: "power3.out", immediateRender: false }, 2.0);
      tl.fromTo($("10-close-panel"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 2.0);

      [["10-close-p1", 2.0], ["10-close-p2", 3.0], ["10-close-p3", 3.6]].forEach(function (p) {
        tl.fromTo($(p[0]), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, p[1]);
      });

      // 3.6s: pixel-glitch column + QR-block arrive together, then stillness
      all("10-close-glitch").forEach(function (el, i) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 3.6 + i * 0.04);
      });
      tl.fromTo(qr, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.6);

      // last 0.6s: the whole frame fades to paper (the film's only real ending)
      tl.fromTo($("10-close-fade"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power3.inOut" }, 7.24);

      window.__timelines = window.__timelines || {};
      window.__timelines["10-close"] = tl;
    })();
  </script>
