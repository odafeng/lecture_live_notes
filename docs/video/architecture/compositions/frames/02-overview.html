    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const ID = "02-overview";
        const $ = (k) => document.getElementById(ID + "-" + k);
        const E = "power3.out";
        const tl = gsap.timeline({ paused: true });

        // svg-path-draw: dash = measured length, dashoffset len → 0
        function draw(el, at, dur) {
          const len = el.getTotalLength();
          el.style.strokeDasharray = len + " " + len;
          tl.fromTo(el, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: E }, at);
        }
        function rise(el, at, dur, dy) {
          tl.fromTo(el, { opacity: 0, y: dy }, { opacity: 1, y: 0, duration: dur, ease: E }, at);
        }
        function fade(el, at, dur) {
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur, ease: E }, at);
        }
        // Scene 2 box entrance: fade + rise from 8% below
        function boxRise(el, at) {
          tl.fromTo(el, { opacity: 0, yPercent: 8 }, { opacity: 1, yPercent: 0, duration: 0.6, ease: E }, at);
        }
        // spring-pop-entrance: scale 0 → 1, smooth power3 settle, small rise
        function pop(el, at) {
          tl.fromTo(el, { scale: 0, opacity: 0, y: 12 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: E }, at);
        }

        // ---- Scene 1 (0.0–1.4s): kicker + display title ----
        rise($("kicker"), 0.1, 0.7, 16);
        rise($("title"), 0.25, 0.8, 20);

        // ---- Scene 2 (1.4–3.4s): 你的電腦 frame draws, server + disk rise, server → disk ----
        draw($("pen"), 1.4, 0.95);
        rise($("legend"), 1.55, 0.5, 8);
        boxRise($("server"), 2.15);
        boxRise($("disk"), 2.45);
        draw($("w-disk"), 2.85, 0.35);
        fade($("h-disk"), 3.12, 0.2);

        // ---- Scene 3 (3.5–5.0s): browser / live / flash pop, three wires draw, 雲端, count ----
        pop($("browser"), 3.5);
        pop($("live"), 3.75);
        pop($("flash"), 4.0);
        fade($("cloud"), 3.9, 0.5);

        draw($("w-ws"), 3.8, 0.4);
        fade($("h-ws"), 4.12, 0.2);
        rise($("t-ws"), 4.05, 0.45, 8);

        draw($("w-live"), 4.05, 0.45);
        fade($("h-live-a"), 4.4, 0.2);
        fade($("h-live-b"), 4.4, 0.2);
        rise($("t-live"), 4.3, 0.45, 8);

        draw($("w-flash"), 4.3, 0.45);
        fade($("h-flash-a"), 4.65, 0.2);
        fade($("h-flash-b"), 4.65, 0.2);
        rise($("t-flash"), 4.55, 0.45, 8);

        // fifth box (flash) lands at 4.55 → the count appears
        rise($("counter"), 4.55, 0.45, 10);

        // ---- Scene 4 (5.1–10.75s): thesis, per-phrase reveal on the VO cues ----
        // dynamic-content-sequencing: per-phrase timing is pre-computed once from content
        // length; phrase starts are the narration cues, the underline lands after its phrase.
        const BASE = 0.3;          // s, minimum reveal window per phrase
        const SEC_PER_CHAR = 0.04; // s, char stagger (wide CJK glyphs)
        const CHAR_DUR = 0.5;
        const MARK_DUR = 0.5;
        const CONTENT = [
          { key: "p1", at: 5.1 },
          { key: "p2", at: 6.6, mark: "m1" },
          { key: "p3", at: 7.9, mark: "m2" },
        ];

        function splitChars(el) {
          const out = [];
          const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);
          nodes.forEach((node) => {
            const frag = document.createDocumentFragment();
            Array.from(node.textContent).forEach((c) => {
              const s = document.createElement("span");
              s.className = "ch";
              s.textContent = c;
              frag.appendChild(s);
              out.push(s);
            });
            node.parentNode.replaceChild(frag, node);
          });
          return out;
        }

        const TIMELINE = CONTENT.map((entry) => {
          const chars = splitChars($(entry.key));
          const reveal = BASE + chars.length * SEC_PER_CHAR;
          return { ...entry, chars, markAt: entry.at + reveal };
        });

        TIMELINE.forEach((entry) => {
          entry.chars.forEach((c, i) => {
            tl.fromTo(c, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: CHAR_DUR, ease: E }, entry.at + i * SEC_PER_CHAR);
          });
          if (entry.mark) {
            tl.fromTo($(entry.mark), { scaleX: 0 }, { scaleX: 1, duration: MARK_DUR, ease: E }, entry.markAt);
          }
        });

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
