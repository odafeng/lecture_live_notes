    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FRAME = "07-corrections";
        var root = document.querySelector('[data-composition-id="' + FRAME + '"]');
        function q(id) { return root.querySelector('[id="' + FRAME + "-" + id + '"]'); }
        function qa(ids) { return ids.map(q); }

        // svg-path-draw setup: measured lengths, dash fully offset
        root.querySelectorAll(".c07-draw, .c07-check").forEach(function (p) {
          var len = p.getTotalLength() * 1.02;
          p.style.strokeDasharray = len + " " + len;
          p.style.strokeDashoffset = String(len);
        });
        var scribble = q("scribble");
        var sLen = scribble.getTotalLength();
        gsap.set(scribble, { strokeDasharray: sLen, strokeDashoffset: sLen });

        var tl = gsap.timeline({ paused: true });
        var E = "power3.out";

        function rise(el, at, dur, dy) {
          tl.fromTo(el, { opacity: 0, y: dy == null ? 14 : dy }, { opacity: 1, y: 0, duration: dur || 0.6, ease: E }, at);
        }
        function pop(el, at, dur) {
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur || 0.25, ease: "power1.out" }, at);
        }

        // ---- Scene 1 (0.0–2.1): top bar + minimap; three nodes, no error yet
        tl.fromTo(q("minimap"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 0);
        rise(q("layer"), 0.05, 0.5, 10);
        rise(q("title"), 0.15, 0.6, 16);
        tl.fromTo(q("rule"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.7, ease: E }, 0.25);
        tl.fromTo(qa(["mm-browser", "mm-l1", "mm-server", "mm-l2", "mm-flash"]),
          { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out", stagger: 0.12 }, 0.8);
        rise(q("n1"), 1.0, 0.6);
        rise(q("n2"), 1.25, 0.6);
        rise(q("n3"), 1.5, 0.6);
        tl.fromTo(q("thin1"), { opacity: 0 }, { opacity: 0.45, duration: 0.35, ease: "power1.out" }, 1.7);
        tl.fromTo(q("thin2"), { opacity: 0 }, { opacity: 0.45, duration: 0.35, ease: "power1.out" }, 1.9);

        // ---- Scene 2 (2.2–6.0): need card; error appears, travels, grows
        rise(q("needlabel"), 2.2, 0.5, 10);
        rise(q("needtext"), 2.35, 0.6);
        gsap.set(qa(["m1", "m2", "m3", "c1", "c2", "c3"]), { transformOrigin: "50% 50%" });
        tl.fromTo(q("m1"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: E }, 2.2);
        // 3.2 "被壓縮": a copy leaves node 1 and lands on node 2, larger
        tl.fromTo(q("m2"), { opacity: 0, x: -360, scale: 1 }, { opacity: 1, duration: 0.05, ease: "none" }, 3.2);
        tl.to(q("m2"), { x: 0, scale: 1.4, duration: 0.6, ease: E }, 3.22);
        // 4.2 "再被整併": on to node 3, larger again
        tl.fromTo(q("m3"), { opacity: 0, x: -360, scale: 1.4 }, { opacity: 1, duration: 0.05, ease: "none" }, 4.2);
        tl.to(q("m3"), { x: 0, scale: 1.8, duration: 0.6, ease: E }, 4.22);
        // 5.0 arrows turn into thick solid lines (svg-path-draw)
        tl.to(qa(["thin1", "thin2"]), { opacity: 0, duration: 0.3, ease: "power1.out" }, 5.0);
        tl.to(q("thick1"), { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 5.0);
        tl.fromTo(q("thick1h"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 5.38);
        tl.to(q("thick2"), { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 5.34);
        tl.fromTo(q("thick2h"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 5.72);

        // ---- Scene 3 (6.1–9.3): design card; corrections injected into three prompts
        tl.fromTo(q("divider"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: E }, 6.05);
        rise(q("designlabel"), 6.1, 0.5, 10);
        rise(q("designtext"), 6.25, 0.6);
        rise(q("designsrc"), 6.6, 0.5, 10);
        rise(q("corrcard"), 6.3, 0.6, 18);
        rise(q("p1"), 6.8, 0.5, 10);
        rise(q("p2"), 6.95, 0.5, 10);
        rise(q("p3"), 7.1, 0.5, 10);
        tl.to(q("L1"), { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 7.9);
        pop(q("L1h"), 8.32, 0.12);
        pop(q("p1lit"), 8.38, 0.3);
        tl.to(q("L2"), { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 8.25);
        pop(q("L2h"), 8.77, 0.12);
        pop(q("p2lit"), 8.83, 0.3);
        tl.to(q("L3"), { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 8.65);
        pop(q("L3h"), 9.22, 0.12);
        pop(q("p3lit"), 9.26, 0.3);

        // ---- Scene 4 (9.4–11.0): conflict rule + marker underline; errors deleted (scale-swap)
        rise(q("ruletext"), 9.4, 0.5, 10);
        tl.to(scribble, { strokeDashoffset: 0, duration: 0.8, ease: "power1.inOut" }, 9.7);
        // outgoing: error markers rush away
        tl.to(q("m1"), { scale: 0.7, opacity: 0, duration: 0.35, ease: "power2.in" }, 9.9);
        tl.to(q("m2"), { scale: 0.98, opacity: 0, duration: 0.35, ease: "power2.in" }, 9.9);
        tl.to(q("m3"), { scale: 1.26, opacity: 0, duration: 0.35, ease: "power2.in" }, 9.9);
        // incoming: corrected state, same origin, on top, long-tail ease (no overshoot per STAGE §6)
        tl.fromTo(qa(["c1", "c2", "c3"]), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.55, ease: E }, 10.1);
        tl.to(root.querySelectorAll(".c07-check"), { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 10.4);

        // ---- Scene 5 (11.1–14.82): handwritten notes bypass every prompt
        rise(q("handcard"), 11.1, 0.6, 18);
        tl.to(q("B"), { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 11.6);
        pop(q("Bh"), 12.5, 0.15);
        rise(q("junction"), 12.7, 0.5, 10);
        rise(q("nomodel"), 13.3, 0.5, 10);

        // hold to the end of the frame
        tl.set({}, {}, 14.82);

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME] = tl;
      })();
    </script>
  </div>
</template>
