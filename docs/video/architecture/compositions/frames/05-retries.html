      tl.fromTo(all(c("decade")), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: E, stagger: 0.08 }, 1.5);

      // Scene 2 (2.5–5.1): need card
      tl.fromTo(one(c("need-tag")), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 2.5);
      tl.fromTo(one(c("need-text")), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 2.65);

      // Row heads (name + constant + empty cell tracks + divider)
      function rowIn(n, t) {
        var row = one(c("r" + n));
        tl.fromTo(one(c("rowdiv"), row), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: E }, t);
        tl.fromTo(one(c("name"), row), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, t);
        tl.fromTo(one(c("const"), row), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, t + 0.12);
        tl.fromTo(all(c("track"), row), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: E, stagger: 0.07 }, t + 0.1);
      }

      // Bars: pixel-cell fill reveals by clip (cells stay crisp), value label rides the tip,
      // number counts up (snapped innerText) while scaling to its final size (counting-dynamic-scale), suffix after the count.
      function barIn(bar) {
        var t = parseFloat(bar.getAttribute("data-t"));
        var d = parseFloat(bar.getAttribute("data-d"));
        var v = parseFloat(bar.getAttribute("data-v"));
        var s0 = parseFloat(bar.getAttribute("data-s0") || "0.5");
        var fill = one(c("fill"), bar);
        var mover = one(c("mover"), bar);
        var val = one(c("val"), bar);
        var num = one(c("num"), bar);
        var suf = one(c("suf"), bar);
        tl.fromTo(fill, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: d, ease: E }, t);
        tl.fromTo(mover, { xPercent: -100 }, { xPercent: 0, duration: d, ease: E }, t);
        tl.fromTo(val, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: E }, t);
        // property tween (not onUpdate): the renderer seeks with events suppressed
        tl.fromTo(num, { innerText: 0 }, { innerText: v, snap: { innerText: 1 }, duration: d, ease: E }, t);
        tl.fromTo(num, { scale: s0 }, { scale: 1, duration: d, ease: E }, t);
        tl.fromTo(suf, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: E }, t + d);
      }

      // Scene 3 (5.2–8.8): row 1, bars on "兩秒、四秒、八秒", tail note at 8.4
      rowIn(1, 5.2);
      all(c("bar"), one(c("r1"))).forEach(barIn);
      tl.fromTo(one(c("tail")), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, 8.4);

      // Scene 4 (8.9–11.4): design card + row 2, 120s lands at 10.9
      tl.fromTo(one(c("carddiv")), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: E }, 8.85);
      tl.fromTo(one(c("design-tag")), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 8.9);
      tl.fromTo(one(c("design-text")), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 9.0);
      tl.fromTo(one(c("design-src")), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 9.2);
      rowIn(2, 8.95);
      all(c("bar"), one(c("r2"))).forEach(barIn);

      // Scene 5 (11.5–16.28): row 3, bars on "一分鐘、五分鐘、十五分鐘", then hold
      rowIn(3, 11.5);
      all(c("bar"), one(c("r3"))).forEach(barIn);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-retries"] = tl;
    })();
  </script>
</template>
