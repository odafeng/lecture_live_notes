  <script>
    (function () {
      var ID = "06-two-paths";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var INK = "#1F2BE0";
      var PAPER = "#F0EBDE";
      var FAINT = "rgba(31,43,224,0.18)";
      var E = "power3.out";

      var tl = gsap.timeline({ paused: true });

      // svg-path-draw: measured length, dash = length, offset length -> 0
      function draw(el, at, dur) {
        var len = el.getTotalLength ? el.getTotalLength() : 0;
        if (!len) { el.setAttribute("pathLength", "1000"); len = 1000; }
        el.style.strokeDasharray = len + " " + len;
        tl.fromTo(el, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      }
      function fadeUp(el, at, dur, dy) {
        tl.fromTo(el, { opacity: 0, y: dy == null ? 24 : dy }, { opacity: 1, y: 0, duration: dur || 0.6, ease: E }, at);
      }
      function fadeIn(el, at, dur) {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur || 0.3, ease: "power1.out" }, at);
      }

      // ---- Scene 1 (0.0–2.4): top bar + minimap settle, relevant boxes light
      fadeUp($("minimap"), 0.0, 0.6, 10);
      fadeUp($("mmlabel"), 0.0, 0.6, 10);
      fadeUp($("layer"), 0.05, 0.5, 14);
      fadeUp($("title"), 0.15, 0.6, 24);
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: E }, 0.3);
      // light server + disk + server->disk link after the layer name lands
      tl.fromTo([$("mm-server"), $("mm-disk")], { fill: PAPER, stroke: FAINT }, { fill: INK, stroke: INK, duration: 0.45, ease: E }, 0.95);
      tl.fromTo([$("mm-server-t"), $("mm-disk-t")], { fill: FAINT }, { fill: PAPER, duration: 0.45, ease: E }, 0.95);
      tl.fromTo($("mm-link"), { stroke: FAINT }, { stroke: INK, duration: 0.45, ease: E }, 0.95);

      // ---- Scene 2 (2.5–4.7): need card; finalize_input.json drops in from 8% above
      fadeUp($("need"), 2.5, 0.6, 24);
      fadeIn($("divider"), 2.7, 0.4);
      tl.fromTo($("file"), { opacity: 0, yPercent: -107.5 }, { opacity: 1, yPercent: 0, duration: 0.8, ease: E }, 3.0);

      // ---- Scene 3 (4.8–6.5): rerun loop draws, mono tag
      draw($("loop"), 4.85, 0.6);
      fadeIn($("loop-head"), 5.38, 0.2);
      tl.fromTo($("rerun"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, 5.55);

      // ---- Scene 4 (6.6–10.7): upper path at 7.9, lower path at 8.9
      fadeIn($("up-node"), 7.9, 0.2);
      fadeUp($("uplabel"), 7.9, 0.5, 12);
      draw($("up"), 7.95, 0.75);
      fadeIn($("low-node"), 8.9, 0.2);
      fadeUp($("lowlabel"), 8.9, 0.5, -12);
      draw($("low"), 8.95, 0.75);

      // ---- Scene 5 (10.8–12.9): design card; paths merge; lock; publish -> final_notes.md
      fadeUp($("design"), 10.8, 0.6, 24);
      draw($("merge"), 11.05, 0.4);
      fadeIn($("merge-head"), 11.4, 0.15);
      tl.fromTo($("lock"), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.55, ease: E }, 11.3);
      fadeUp($("locklabel"), 11.6, 0.45, 10);
      draw($("out"), 11.95, 0.3);
      fadeIn($("out-head"), 12.2, 0.15);
      fadeUp($("publabel"), 12.15, 0.45, 10);
      tl.fromTo($("result"), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.55, ease: E }, 12.3);

      // ---- Scene 6 (13.0–16.48): late failure slides along the upper path, stopped at the lock
      var fail = $("fail");
      // later segments share props with the pop, so they must not render at build time
      tl.fromTo(fail, { scale: 0, opacity: 0, xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.4, ease: E }, 13.05);
      tl.fromTo(fail, { xPercent: 0 }, { xPercent: 69.565, duration: 0.6, ease: "power1.in", immediateRender: false }, 13.45);
      tl.fromTo(fail, { yPercent: 0 }, { yPercent: 240.385, duration: 0.35, ease: "none", immediateRender: false }, 14.05);
      tl.fromTo(fail, { xPercent: 69.565 }, { xPercent: 122.609, duration: 0.45, ease: E, immediateRender: false }, 14.4);
      draw($("slash-a"), 14.95, 0.25);
      draw($("slash-b"), 15.1, 0.25);
