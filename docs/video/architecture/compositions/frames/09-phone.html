  <script>
    (function () {
      var $ = function (name) { return document.getElementById("09-phone-" + name); };
      var tl = gsap.timeline({ paused: true });
      var E = "power3.out";

      // svg-path-draw: measured length, offset len -> 0
      function draw(name, at, dur, ease) {
        var p = $(name);
        var len = p.getTotalLength() * 1.02;
        tl.fromTo(p,
          { strokeDasharray: len, strokeDashoffset: len },
          { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" },
          at);
      }
      // fade-rise entrance
      function rise(name, at, dist, dur) {
        tl.fromTo($(name),
          { opacity: 0, y: dist === undefined ? 16 : dist },
          { opacity: 1, y: 0, duration: dur || 0.6, ease: E },
          at);
      }
      // spring-pop entrance (smooth settle, no overshoot)
      function pop(name, at, dur) {
        tl.fromTo($(name),
          { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
          { scale: 1, opacity: 1, duration: dur || 0.55, ease: E },
          at);
      }
      // css-marker highlight sweep
      function mark(name, at) {
        tl.fromTo($(name), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, at);
      }

      // Scene 1 (0.0–2.2): minimap settles, top bar, then lit boxes
      tl.fromTo($("minimap"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 0);
      rise("layer", 0.3, 14, 0.5);
      rise("title", 0.45, 28, 0.7);
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: E }, 0.6);
      tl.fromTo($("mini-lit"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 1.25);

      // Scene 2 (2.3–3.8): need card + phone outline draws
      rise("need-label", 2.3, 14, 0.5);
      rise("need-1", 2.4, 18, 0.6);
      draw("body", 2.4, 0.8);
      draw("screen", 2.95, 0.6);
      draw("speaker", 3.4, 0.3);
      draw("home", 3.5, 0.3);

      // Scene 3 (3.9–6.6): HTTPS lock seal + need line 2
      pop("seal", 3.9, 0.55);
      draw("shackle", 4.15, 0.4);
      draw("seal-tick", 4.35, 0.3);
      rise("need-2", 4.7, 18, 0.6);
      mark("hl-https", 5.4);

      // Scene 4 (6.7–9.4): design card, tunnel draws, Mac arrives at 8.0
      tl.fromTo($("divider"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: E }, 6.6);
      rise("design-label", 6.7, 14, 0.5);
      rise("design-1", 6.8, 18, 0.6);
      rise("design-adr", 7.2, 12, 0.5);
      draw("rail-top", 6.7, 1.2);
      draw("rail-bot", 6.8, 1.2);
      draw("rail-mid", 6.9, 1.0);
      tl.fromTo($("arrow"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 7.8);
      rise("tun-name", 7.2, 12, 0.6);
      rise("tun-host", 7.4, 12, 0.6);
      pop("mac", 8.0, 0.6);

      // Scene 5 (9.5–10.8): PWA chip inside the phone screen
      pop("pwa", 9.6, 0.55);

      // Scene 6 (10.9–14.67): cloud + labels, then struck out
      draw("cloud-path", 10.9, 0.8);
      pop("chip-key", 11.35, 0.5);
      pop("chip-content", 11.5, 0.5);
      draw("strike-a", 12.4, 0.35);
      draw("strike-b", 12.6, 0.35);
      tl.to([$("cloud-path"), $("chip-key"), $("chip-content")], { opacity: 0.4, duration: 0.5, ease: "power1.out" }, 13.0);
      rise("design-local", 12.65, 12, 0.5);
      mark("hl-local", 13.1);

      // hold to the end of the frame
      tl.to({}, { duration: 0 }, 14.67);

      window.__timelines = window.__timelines || {};
      window.__timelines["09-phone"] = tl;
    })();
  </script>
