      <div id="08-translations-note-404" class="08-translations-abs 08-translations-note" style="top: calc(var(--u) * 543);"><span class="08-translations-note-lead"></span>404 · is_current()</div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    (function () {
      const $ = (n) => document.getElementById("08-translations-" + n);
      const INK = "#1F2BE0";
      const PAPER = "#F0EBDE";
      const FAINT = "rgba(31,43,224,0.18)";
      const E = "power3.out";

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.8): top bar + minimap settle, then this layer's boxes light up
      tl.fromTo($("mini"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 0);
      tl.fromTo($("layer-label"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 0.1);
      tl.fromTo($("layer-name"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: E }, 0.25);
      tl.fromTo($("topbar-rule"), { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: E }, 0.4);

      tl.fromTo([$("mini-b-flash"), $("mini-b-disk")], { fill: PAPER, stroke: FAINT }, { fill: INK, stroke: INK, duration: 0.5, ease: E, stagger: 0.12 }, 1.05);
      tl.fromTo([$("mini-t-flash"), $("mini-t-disk")], { fill: FAINT }, { fill: PAPER, duration: 0.5, ease: E, stagger: 0.12 }, 1.05);
      tl.fromTo([$("mini-l-flash"), $("mini-l-disk")], { stroke: FAINT }, { stroke: INK, duration: 0.5, ease: E, stagger: 0.12 }, 1.2);
      tl.fromTo([$("mini-a-flash"), $("mini-a-disk")], { fill: FAINT }, { fill: INK, duration: 0.5, ease: E, stagger: 0.12 }, 1.2);

      // Scene 2 (1.9–3.7): need card
      tl.fromTo($("need-tag"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 1.9);
      tl.fromTo($("need-line"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 2.05);

      // Scene 3 (3.8–6.4): design card, then the original lands and its frame thickens
      tl.fromTo($("divider"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: E }, 3.8);
      tl.fromTo($("design-tag"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 3.9);
      tl.fromTo($("design-line"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 4.05);
      tl.fromTo($("design-src"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 4.4);
      tl.fromTo($("orig"), { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: E }, 4.7);
      tl.fromTo($("orig-thick"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: E }, 5.55);

      // Scene 4 (6.5–9.5): center-outward-expansion — every translation leaves the
      // original's center (870, 605) and settles in its slot on "英 / 德 / 波蘭 / 西班牙"
      const ORIGIN_X = 870, ORIGIN_Y = 605, CARD_CX = 1310;
      const fan = [
        { k: "en", cy: 401, land: 6.8 },
        { k: "de", cy: 537, land: 7.4 },
        { k: "pl", cy: 673, land: 7.8 },
        { k: "es", cy: 809, land: 8.2 },
      ];
      fan.forEach((f) => {
        const start = f.land - 0.6;
        tl.fromTo(
          $("card-" + f.k),
          { x: ORIGIN_X - CARD_CX, y: ORIGIN_Y - f.cy, scale: 0.6, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.9, ease: E },
          start
        );
        const path = $("link-" + f.k);
        const len = Number(path.dataset.len);
        tl.fromTo(path, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.7, ease: E }, start + 0.15);
        tl.fromTo($("arrow-" + f.k), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: E }, start + 0.6);
      });

      // Scene 5 (9.6–11.3): PL fails — crossed out, dimmed; nothing else moves
      tl.fromTo($("pl-x1"), { rotation: -15.64, scaleX: 0 }, { rotation: -15.64, scaleX: 1, duration: 0.35, ease: E }, 9.8);
      tl.fromTo($("pl-x2"), { rotation: 15.64, scaleX: 0 }, { rotation: 15.64, scaleX: 1, duration: 0.35, ease: E }, 9.98);
      tl.fromTo($("inner-pl"), { opacity: 1 }, { opacity: 0.3, duration: 0.5, ease: E }, 10.1);
      tl.fromTo([$("link-pl"), $("arrow-pl")], { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: E }, 10.1);
      tl.fromTo($("note-pl"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 10.3);

      // Scene 6 (11.4–14.3): DE is older than the original — its download is struck, 404
      tl.fromTo($("note-mtime"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 11.6);
      tl.fromTo($("btn-x1"), { rotation: -21.16, scaleX: 0 }, { rotation: -21.16, scaleX: 1, duration: 0.3, ease: E }, 12.9);
      tl.fromTo($("btn-x2"), { rotation: 21.16, scaleX: 0 }, { rotation: 21.16, scaleX: 1, duration: 0.3, ease: E }, 13.05);
      tl.fromTo($("btn-inner-de"), { opacity: 1 }, { opacity: 0.3, duration: 0.4, ease: E }, 13.1);
      tl.fromTo($("note-404"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 13.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["08-translations"] = tl;
    })();
  </script>
</template>
