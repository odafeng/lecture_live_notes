  <title>Lecture — 連不上課堂服務</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f2; color: #283d33;

    main { max-width: 30rem; padding: 32px 24px; }

<body>
  <main>
    <h1>連不上 Mac 上的課堂服務</h1>
    <p>這支手機現在碰不到錄音用的 server。請檢查：</p>
    <ul>
      <li>Mac 醒著，而且已經開啟 Lecture.app</li>
      <li>Mac 與手機的 Tailscale 都已連線</li>
      <li>Mac 上的 <code>tailscale serve</code> 仍在執行</li>

    <a href="/">重新連線</a>
